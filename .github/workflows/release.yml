# Every push to main: test, build the Windows installer, publish a GitHub release.
# The app's update check reads the latest release from this repo.
name: Build and release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Set version
        id: ver
        shell: bash
        run: node scripts/ci-version.mjs ${{ github.run_number }} >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npx tsc --noEmit

      # Failed tests also show as annotations on the run page (job logs need sign-in to read).
      - name: Rust tests
        working-directory: src-tauri
        shell: bash
        run: |
          cargo test --workspace 2>&1 | tee test.log
          s=${PIPESTATUS[0]}
          grep -A1 "panicked at" test.log | grep -v '^--$' | paste -d' ' - - | sed 's/^/::error::/'
          exit $s

      # The installer bundles the elevated helper from target/release.
      - name: Build helper
        working-directory: src-tauri
        run: cargo build --release -p sweepr-helper

      - name: Build installer
        run: npx tauri build

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Sweepr ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            Windows 10/11 installer. Download **Sweepr_${{ steps.ver.outputs.version }}_x64-setup.exe** below.

            The installer is not code-signed yet: if SmartScreen shows "Windows protected your PC", choose **More info → Run anyway**.
          files: src-tauri/target/release/bundle/nsis/*.exe
