[workspace]
members = ["core", "helper"]
default-members = [".", "helper"]

[package]
name = "sweepr"
version = "0.1.0"
edition = "2021"
description = "Sweepr - Windows PC cleaner"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sweepr-core = { path = "core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO", "Win32_Security", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
